<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141618">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CraneBrain">
<title>CraneBrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="css-svc">
:root{
  --bg:#ECEEEF;--surface:#FFFFFF;--surface-2:#F4F5F6;--ink:#141618;--muted:#5B6268;--line:#D2D6D9;
  --brand:#F2C200;--red:#C8102E;--gA:#D7263D;--gB:#E97A14;--gC:#E0B80E;--gD:#2B9455;--gN:#7D858B;--focus:#1B6FD1;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--surface:#1C1F22;--surface-2:#25292D;--ink:#ECEEEF;--muted:#9AA2A8;--line:#363C41;--focus:#6FA8FF}}
:root[data-theme="dark"]{--bg:#121416;--surface:#1C1F22;--surface-2:#25292D;--ink:#ECEEEF;--muted:#9AA2A8;--line:#363C41;--focus:#6FA8FF}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{box-sizing:border-box;max-width:100%;min-width:0}
details,details *{box-sizing:border-box}
.grid2>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
.muted{color:var(--muted)}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top{background:#141618;color:#fff}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px;max-width:760px;margin:0 auto}
.mark{width:34px;height:34px;border-radius:8px;flex:none;background:url(/icon-192.png?v=2) center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.bt{flex:1;min-width:0}
.t1{font:700 21px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:#B5BCC1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border:0;background:#2A2E32;color:#fff;font-size:26px;line-height:1;border-radius:8px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 12px 10px;max-width:760px;margin:0 auto}
.tabs button{border:0;background:#2A2E32;color:#D8DDE0;padding:9px 0;border-radius:7px;font-weight:600}
.tabs button.on{background:var(--brand);color:#141618}

main{max-width:760px;margin:0 auto;padding:12px 12px 120px}

/* section chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 6px;padding:4px 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.chip.on .c{color:inherit;opacity:.75}
.chip.done::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gD);margin-right:7px;vertical-align:1px}

h2.sec{font:700 30px/1.05 var(--cond);margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.h3{font:700 20px/1.1 var(--cond);margin:22px 0 10px}

/* item cards */
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
.card[data-grade=A]{border-left-color:var(--gA)}
.card[data-grade=B]{border-left-color:var(--gB)}
.card[data-grade=C]{border-left-color:var(--gC)}
.card[data-grade=D]{border-left-color:var(--gD)}
.card[data-grade=NA]{border-left-color:var(--gN)}
.ch{display:flex;gap:10px;align-items:flex-start}
.num{font:700 24px/1 var(--cond);color:var(--muted);min-width:28px;padding-top:1px;font-variant-numeric:tabular-nums}
.nm h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.hint{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
.g[data-g=NA],.g[data-g=NI]{grid-column:span 2;min-height:40px}
.g{min-height:56px;border:2px solid var(--line);background:var(--surface-2);border-radius:8px;font:700 27px/1 var(--cond);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.g small{font:500 10.5px/1.1 var(--font);color:var(--muted);margin-top:3px}
.g[data-g=NA],.g[data-g=NI]{font-size:16px;color:var(--muted);flex-direction:row}
.g.on{color:#fff}
.g.on small{color:rgba(255,255,255,.92)}
.g.on[data-g=A]{background:var(--gA);border-color:var(--gA)}
.g.on[data-g=B]{background:var(--gB);border-color:var(--gB)}
.g.on[data-g=C]{background:var(--gC);border-color:var(--gC);color:#141618}
.g.on[data-g=C] small{color:#141618}
.g.on[data-g=D]{background:var(--gD);border-color:var(--gD)}
.g.on[data-g=NA]{background:var(--gN);border-color:var(--gN);color:#fff}
.g.on[data-g=NI]{background:#50607F;border-color:#50607F;color:#fff}
.card[data-grade=NI]{border-left-color:#50607F}
.badge.gNI{background:#50607F;font-size:12px}

textarea,input,select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{resize:none;min-height:46px;overflow:hidden;display:block}
input[type=date]{min-height:46px}
.parts{margin-top:8px;border-color:var(--gB)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2);flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.addph{height:74px;min-width:74px;border:2px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-weight:600;padding:0 12px}
.addph{position:relative;overflow:hidden;cursor:pointer}
.addph input.pin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;z-index:1}
.addph:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.lib{display:flex;align-items:center;justify-content:center}
.addph.cam{background:var(--brand);border:2px solid var(--brand);color:#141618;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;min-width:86px}
.addph.lib{font-size:13px;min-width:64px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pgrid figure{margin:0}
.pgrid .th,.pgrid .addph{width:100%;height:auto;aspect-ratio:4/3}
.pgrid .addph.lib{aspect-ratio:auto;min-height:48px}
.pgrid figcaption{font-size:13px;margin-top:4px;color:var(--ink);overflow-wrap:anywhere}

details.key{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
details.key summary{font-weight:600;cursor:pointer}
details.key div{display:flex;gap:10px;align-items:center;margin-top:8px}
.badge{display:inline-flex;min-width:28px;height:28px;padding:0 6px;border-radius:6px;align-items:center;justify-content:center;font:700 18px/1 var(--cond);color:#fff;flex:none}
.badge.gA{background:var(--gA)}.badge.gB{background:var(--gB)}.badge.gC{background:var(--gC);color:#141618}.badge.gD{background:var(--gD)}.badge.gNA{background:var(--gN);font-size:13px}

/* forms */
.fl{display:block;margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:500}
.fl>input,.fl>textarea,.fl>select,.fl>.seg{margin-top:4px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.act[data-type=advisory]{border-left:4px solid var(--gC)}
.act[data-type=remedial]{border-left:4px solid var(--gB)}
.parts-h{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.prow{display:grid;grid-template-columns:76px 1fr 32px;gap:6px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.prow input:first-child{grid-column:1/-1}
.prow input,.prow select{padding:9px 8px;font-size:15px}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;justify-self:start}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.sig{margin:0 0 14px}
.sig-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
.sig canvas{width:100%;height:160px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.ovl{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 14px}
.ovl .badge{width:48px;height:48px;font-size:30px}
.warn{background:var(--surface);border:1px solid var(--gB);border-left:6px solid var(--gB);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.warn ul{margin:6px 0 0;padding-left:20px}
.warn ul.chk{list-style:none;padding-left:0}
.chk .link{color:var(--ink);text-align:left;padding:6px 0;font-size:15px;display:block}
.chk .link.reqd{color:var(--gA);font-weight:600}
.chk .link::before{content:"\2192  ";color:var(--gB);font-weight:700}
.ok{background:var(--surface);border:1px solid var(--gD);border-left:6px solid var(--gD);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.req{color:var(--gA);font-size:12px;font-weight:600;margin-left:4px}
.req.ok{display:none}
.alert{color:var(--gA);font-weight:600;font-size:14px;margin:-4px 0 12px}

/* buttons */
.btn{border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:600;background:var(--surface);min-height:46px}
.btn.primary{background:var(--brand);color:#141618;border-color:var(--brand)}
.btn.danger{background:var(--gA);color:#fff;border-color:var(--gA)}
.btn.danger.ghost{background:transparent;color:var(--gA);border-color:var(--gA)}
.btn.block{display:block;width:100%;text-align:center;margin:4px 0 12px}
.xl{display:grid;gap:10px}
.btn.big{min-height:56px;font-size:17px;width:100%}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.dock:empty{display:none}
.dock-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.pl{font-size:12.5px;color:var(--muted);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}

/* home */
.new{width:100%;min-height:64px;font-size:19px;margin:6px 0 16px}
.search{margin:0 0 12px}
.rc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rc[data-grade=A]{border-left-color:var(--gA)}.rc[data-grade=B]{border-left-color:var(--gB)}.rc[data-grade=C]{border-left-color:var(--gC)}.rc[data-grade=D]{border-left-color:var(--gD)}
.rc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc .j{font:700 23px/1.1 var(--cond)}
.rc .m{color:var(--muted);font-size:14px;margin-top:2px}
.rc .prog{margin-top:10px}
.rc .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.sitebox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.sitebox .m{color:var(--muted);font-size:14px;margin-top:2px}
details.sd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px}
details.sd>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sd>summary::-webkit-details-marker{display:none}
details.sd>summary .m{color:var(--muted);font-weight:400;font-size:14px}
details.sd[open]>summary{margin-bottom:12px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.tally div{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.tally b{display:block;font:700 26px/1 var(--cond)}
.tally span{font-size:12px;color:var(--muted)}
.tally .tA{border-top-color:var(--gA)}.tally .tB{border-top-color:var(--gB)}.tally .tC{border-top-color:var(--gC)}.tally .tD{border-top-color:var(--gD)}
.cnum{font:700 15px/1 var(--cond);color:var(--muted);margin-bottom:2px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{display:flex;justify-content:center;margin-top:18px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet p{margin:0 0 6px;font-size:17px}
.sheet img.big{width:100%;max-height:58vh;object-fit:contain;background:#000;border-radius:8px;display:block;margin-bottom:12px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#141618;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:14px;max-width:90%;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.3)}

/* preview paper */
.paper{background:#fff;color:#111;border-radius:6px;padding:10px;border:1px solid var(--line);overflow-x:auto}
.rp{font-family:'Barlow',Arial,sans-serif;color:#111;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.rp table{border-collapse:collapse;width:100%;margin:0 0 12px}
.rp th,.rp td{border:1px solid #333;padding:4px 6px;text-align:left;vertical-align:top}
.rp th{background:#E6E8EA;font-weight:600;white-space:nowrap}
.rp table.hdr td{border:0;padding:0}
.rp .brand{font:700 28px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.05em}
.rp .brand small{display:block;font-size:11px;letter-spacing:.55em;margin-top:2px}
.rp .sq{color:#F2C200}
.rp .addr{font-size:11px;margin-top:8px;color:#333}
.rp .ttl{text-align:right;vertical-align:top;width:50%}
.rp .banner{background:#C8102E;color:#fff;font-weight:700;font-size:18px;padding:8px 12px;text-align:center}
.rp .ov{margin-top:8px;font-size:12.5px;text-align:left}
.rp .no{text-align:center;width:34px}
.rp .gc{width:28px;text-align:center;font-weight:700}
.rp .na{text-align:center;color:#777;font-size:11px}
.rp .ck th{text-align:center}
.rp .ck th.it{text-align:left}
.rp h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #F2C200;padding-bottom:3px}
.rp h3{font-size:13.5px;margin:12px 0 4px}
.rp .figs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.rp figure{margin:0;width:calc(33.33% - 6px)}
.rp .sband{background:#141618;color:#fff;font-weight:700;padding:5px 8px;margin:14px 0 4px;display:flex;justify-content:space-between}
.rp .sband span{font-weight:400;font-size:12px}
.rp .irow{border-bottom:1px solid #ddd;padding:4px 0 8px}
.rp .nc{font-size:11px;color:#777;border:1px solid #aaa;border-radius:4px;padding:0 5px;font-weight:400}
.rp figure img{width:100%;display:block;border:1px solid #ccc}
.rp figcaption{font-size:11px;color:#444;margin-top:2px}
.rp .pre{white-space:pre-wrap}
.rp .sg{max-width:200px;height:auto;display:block;margin-top:4px}
.rp .key td{border:0;padding:1px 6px;font-size:11.5px}
.rp .pill{display:inline-block;padding:0 6px;border-radius:4px;color:#fff;font-weight:700}
/* six-grade scale */
.grades{grid-template-columns:repeat(6,1fr)!important}
.grades .g{grid-column:span 2;font:700 16px/1.05 var(--cond);min-height:52px;text-align:center}
.grades .g[data-g=NA],.grades .g[data-g=NI]{grid-column:span 3;min-height:40px}
.grades .g small{font:500 10px/1.1 var(--font)}
.card[data-grade=N],.rc[data-grade=N]{border-left-color:#17693B}
.g.on[data-g=N]{background:#17693B;border-color:#17693B;color:#fff}.g.on[data-g=N] small{color:#fff}
.badge.gN{background:#17693B;color:#fff;font-size:12px}
.tally .tN{border-top-color:#17693B}
.card[data-grade=S],.rc[data-grade=S]{border-left-color:#7CC46B}
.g.on[data-g=S]{background:#7CC46B;border-color:#7CC46B;color:#141618}.g.on[data-g=S] small{color:#141618}
.badge.gS{background:#7CC46B;color:#141618;font-size:12px}
.tally .tS{border-top-color:#7CC46B}
.card[data-grade=W],.rc[data-grade=W]{border-left-color:#E0B80E}
.g.on[data-g=W]{background:#E0B80E;border-color:#E0B80E;color:#141618}.g.on[data-g=W] small{color:#141618}
.badge.gW{background:#E0B80E;color:#141618;font-size:12px}
.tally .tW{border-top-color:#E0B80E}
.card[data-grade=F],.rc[data-grade=F]{border-left-color:#E97A14}
.g.on[data-g=F]{background:#E97A14;border-color:#E97A14;color:#fff}.g.on[data-g=F] small{color:#fff}
.badge.gF{background:#E97A14;color:#fff;font-size:12px}
.tally .tF{border-top-color:#E97A14}
.card[data-grade=I],.rc[data-grade=I]{border-left-color:#6E7F99}
.g.on[data-g=I]{background:#6E7F99;border-color:#6E7F99;color:#fff}.g.on[data-g=I] small{color:#fff}
.badge.gI{background:#6E7F99;color:#fff;font-size:12px}
.tally .tI{border-top-color:#6E7F99}
.card[data-grade=U],.rc[data-grade=U]{border-left-color:#D7263D}

async function siteChecks(st,reps){const o=[];const miss=[['customer','Customer'],['jobNo','Job number'],['engineer','Engineer']].filter(([k])=>!st[k]).map(x=>x[1]);
 if(miss.length)o.push({t:'Site details missing: '+miss.join(', ')});
 if(reps.length&&!st.engSig)o.push({t:'Engineer signature (site sign-off)',sig:1});
 const ids={};reps.forEach(r=>{const k=(r.job.assetId||'').trim().toLowerCase();if(k)(ids[k]=ids[k]||[]).push(r)});
 Object.values(ids).filter(a=>a.length>1).forEach(a=>o.push({t:`Crane ID ${a[0].job.assetId} is used on ${a.length} cranes`,id:a[1].id,req:1}));
 const keep=R;try{reps.forEach((r,i)=>{R=r;r.items=r.items||{};r.actions=r.actions||[];r.photos=r.photos||[];r.signoff=r.signoff||{};const c=checks();if(c.length){const req=c.some(x=>x.req);o.push({t:`Crane ${i+1} (${craneLabel(r,i)}): ${c.length} thing${c.length>1?'s':''} to check`,id:r.id,req})}})}finally{R=keep}
 return o}
async function addCrane(siteId){const st=SITE&&SITE.id===siteId?SITE:await store.get('sites',siteId);if(!st)return;const reps=await siteReports(siteId);
 const n=newReport();n.siteId=siteId;n.order=Date.now();applySite(n,st);R=n;dirty=true;await flush();tab='inspect';sec=0;renderReport();toast(`Crane ${reps.length+1} added to the site`)}
async function delSite(){const reps=await siteReports(SITE.id);if(!(await confirmBox(`Delete this site and its ${reps.length} crane report${reps.length===1?'':'s'}, with all photos? This cannot be undone.`,'Delete site',true)))return;
 for(const r of reps){for(const ref of allRefs(r))store.del('photos',ref.id);await store.del('reports',r.id);if(cloud.db){try{await cloud.db.doc(P('reports/')+r.id).set({id:r.id,deleted:true,updatedAt:Date.now()})}catch{}}}
 const id=SITE.id;await store.del('sites',id);if(cloud.db){try{await cloud.db.doc(P('sites/')+id).set({id,deleted:true,updatedAt:Date.now()})}catch{}}
 SITE=null;siteDirty=false;toast('Site deleted');renderHome()}

/* turn a photo into something jsPDF can embed, trying three routes so one blocked browser feature can't drop the picture */
async function pdfImg(blob,max=1400,qq=.82){if(!blob)return null;
 if(typeof blob==='string'){try{const p=window.jspdf.jsPDF.API.getImageProperties.call(new window.jspdf.jsPDF(),blob);return{data:blob,fmt:'JPEG',w:p.width,h:p.height}}catch(e){photoErrs.push('copy unreadable: '+(e&&e.message||'error').slice(0,60));try{const im=await loadImg(blob);return{data:blob,fmt:'JPEG',w:im.naturalWidth,h:im.naturalHeight}}catch{return null}}}
 const fromCanvas=src=>{const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;const s=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*s);c.height=Math.round(h0*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return{data:c.toDataURL('image/jpeg',qq),fmt:'JPEG',w:c.width,h:c.height}};
 try{if(window.createImageBitmap){const bm=await createImageBitmap(blob);const r=fromCanvas(bm);bm.close&&bm.close();return r}}catch(e){photoErrs.push('bitmap: '+(e&&e.name||'error'))}
 try{const u=URL.createObjectURL(blob);try{return fromCanvas(await loadImg(u))}finally{URL.revokeObjectURL(u)}}catch{}
 try{const u8=new Uint8Array(await blob.arrayBuffer());const p=window.jspdf.jsPDF.API.getImageProperties.call(new window.jspdf.jsPDF(),u8);return{data:u8,fmt:(p.fileType||'JPEG').toUpperCase(),w:p.width,h:p.height}}catch{}
 photoErrs.push('photo could not be decoded');return null}

function initSigs(root){root.querySelectorAll('canvas[data-sig]').forEach(cv=>{const key=cv.dataset.sig;const dpr=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;

async function saveFile(name,blob){HUB.toDrive(name,blob);
 if(!blob||!blob.size){showErr('The file came out empty.','empty');return 'err'}
 if(cloud.dl){let lastErr=null;
  for(const form of ['blob','buffer']){try{const data=form==='blob'?blob:new Uint8Array(await blob.arrayBuffer());await cloud.dl.save({filename:name,data});toast('Saved '+name);return 'ok'}
   catch(e){const code=e&&e.code;if(code==='declined')return 'declined';if(code==='rate_limited'){toast('A save prompt is already open. Finish that one first.',4000);return 'err'}
    if(code==='rejected_extension'||code==='extension_not_enabled'){showErr('This file type cannot be saved here.',code);return 'ext'}lastErr=e}}
  showErr('The file was built but could not be handed to your phone.',(lastErr&&(lastErr.code||lastErr.message))||'unknown');return 'err'}
 showErr('Saving files is not available in this view. Open the app from its claude.ai link while signed in.','no-downloads');return 'err'}
function showErr(msg,code){modal(`<h3 style="margin:0 0 8px">Could not save the file</h3><p>${esc(msg)}</p><p class="muted" style="font-size:13px">Error code: <b>${esc(String(code))}</b></p><div class="row"><button class="btn primary" data-x="ok">OK</button></div>`,(m,close)=>{m.querySelector('[data-x=ok]').onclick=close})}
async function busy(btn,label,fn){const t=btn.textContent;btn.disabled=true;btn.textContent=label;try{await flush();await fn()}catch(e){console.error(e);modal(`<h3 style="margin:0 0 8px">The report could not be built</h3><p>${esc(e&&e.message?e.message:String(e))}</p><p class="muted" style="font-size:13px">${esc(String(e&&e.stack||'').split('\n').slice(0,3).join(' | '))}</p><div class="row"><button class="btn primary" data-x="ok">OK</button></div>`,(m,close)=>{m.querySelector('[data-x=ok]').onclick=close})}finally{btn.disabled=false;btn.textContent=t}}
